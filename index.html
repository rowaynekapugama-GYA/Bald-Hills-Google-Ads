<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bald Hills Dental | Landing Pages</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/images/logo-icon.webp">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Manrope,system-ui,sans-serif;background:#fbf8f3;color:#0f1f1e;min-height:100vh;display:grid;place-items:center;padding:32px 16px}
  .box{width:100%;max-width:760px;text-align:center}
  .logo{height:56px;width:auto;margin:0 auto 28px}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(28px,5vw,40px);line-height:1.1;margin-bottom:10px}
  p{color:#5d6b69;margin-bottom:28px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  a.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e4ddd2;border-radius:20px;overflow:hidden;text-align:left;transition:transform .2s,box-shadow .2s}
  a.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -20px rgba(15,31,30,.35)}
  a.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
  .bd{padding:18px 20px 22px}
  .bd b{display:block;font-size:18px;margin-bottom:4px}
  .bd span{font-size:14px;color:#5d6b69}
  .tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#23918d;margin-bottom:6px}
  @media (max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="assets/images/logo-horizontal.webp" alt="Bald Hills Dental">
    <h1>Google Ads landing pages</h1>
    <p>Choose a page to preview.</p>
    <div class="grid">
      <a class="card" href="new-patients/"><img src="assets/images/reception.webp" alt=""><div class="bd"><span class="tag">Near Me + Suburbs</span><b>New Patients</b><span>/new-patients/</span></div></a>
      <a class="card" href="emergency-dentist/"><img src="assets/images/consult.webp" alt=""><div class="bd"><span class="tag">Emergency</span><b>Emergency Dentist</b><span>/emergency-dentist/</span></div></a>
    </div>
  </div>
</body>
</html>
